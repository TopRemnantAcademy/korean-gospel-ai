# =========================================================
# Lighthouse (4vCPU / 8GB / 180GB) 운영용 Docker Compose
# — 산업 표준 리소스 거버넌스 + 최신 최적화 적용
#
# 핵심 최적화:
#   1. cgroup CPU/mem limit + reservation 으로 OOM 연쇄 방지 (총합 < 8GB)
#   2. backend: uvicorn workers=2 (2vCPU 기준 공식 공식: 2*CPU+1 → 4vCPU=8→실제 2~4)
#      → 동시 요청 처리 + LLM 스트리밍 블로킹 완화
#   3. Qdrant: embedded 가 아닌 서버 컨테이너 분리 (단일 프로세스 락 리스크 제거)
#      메모리 상한 2GB(HNSW mmap 권장) + API 키 게이트
#   4. Streamlit UI: mem 1.5G, --server.maxMessageSize 로 대용량 업로드 수용
#   5. Caddy: gzip/zstd + 보안 헤더 + 완화된 타임아웃(스트리밍)
#   6. depends_on healthcheck + restart unless-stopped (호스트 재부팅 대비는 gospel.service)
#
# 사용:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# =========================================================

version: '3.8'

x-restart: &restart-policy
  restart: unless-stopped

services:
  # ---- Qdrant Vector Database (내부 전용, 미노출) ----
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: korean-gospel-qdrant-prod
    <<: *restart-policy
    # ⚠️ ports 미선언 → 호스트에서 직접 접근 불가 (Caddy/방화벽 이중 차단)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
      - QDRANT__SERVICE__GRPC_PORT=6334
      # 메모리 거버넌스: HNSW 를 mmap 로 페이징 → RSS 를 2GB 이내로 억제
      - QDRANT__STORAGE__OPTIMIZER_MAX_SEGMENT_SIZE=20000000
      - QDRANT__STORAGE__ON_DISK_VECTORS_DEFAULT=true
    # 소프트-리밋(reservation) + 하드-리밋(mem_limit=2g) 로 OOMKilled 방지
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 1.0
    networks:
      - gospel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---- Backend API (FastAPI) — 내부 전용 ----
  # 최신 관행: uvicorn workers 로 GIL 병목 완화 + --proxy-headers (Caddy 뒤)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korean-gospel-backend-prod
    <<: *restart-policy
    env_file:
      - .env.production
    environment:
      # compose 내 qdrant 컨테이너로 자동 연결 (.env.production 의 QDRANT_URL 이
      # 비어있으면 이 값이 우선). Qdrant Cloud 사용 시 .env.production 에 값 채우면 덮어써짐.
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./gospel.db:/app/gospel.db
      - ./logs:/app/logs
      - ./models:/app/.models
    # 4vCPU 박스 → workers=2 (안전 상한). 메모리 3G + 예약 2G.
    mem_limit: 3g
    mem_reservation: 2g
    cpus: 2.0
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - gospel-network
    healthcheck:
      # uvicorn workers=2 → 100ms 내 응답, 메모리 압박 시 재시도
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---- 통합 UI (Streamlit) — Caddy 가 프록시 ----
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: korean-gospel-ui-prod
    <<: *restart-policy
    env_file:
      - .env.production
    environment:
      - API_BASE=http://backend:8000
      # 대용량 문서 업로드(최대 100MB) 수용
      - STREAMLIT_SERVER_MAX_MESSAGE_SIZE=104857600
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # 헬스체크 라우트 활성화 (/_stcore/healthz)
      - STREAMLIT_SERVER_ENABLE_HEALTH_LISTENER=true
    # ⚠️ KRAI_PUBLIC_MODE(공개 모드) 는 .env.production(env_file) 에서 런타임 주입됨.
    #    app.py/admin/lib/auth.py 가 os.getenv() 로 읽음. 별도 environment: 오버라이드는
    #    호스트 셸에 없는 변수를 false 로 덮어쓰므로 의도적으로 추가하지 않음.
    depends_on:
      - backend
    mem_limit: 1.5g
    mem_reservation: 768m
    cpus: 1.0
    networks:
      - gospel-network
    healthcheck:
      # Streamlit 내장 헬스 라우트 (앱 import 완료 후 200). wget 은 slim 이미지 기본 포함.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8501/_stcore/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---- Caddy 리버스 프록시 (유일한 공개 진입점) ----
  caddy:
    image: caddy:2-alpine
    container_name: korean-gospel-caddy-prod
    <<: *restart-policy
    ports:
      - "8501:8501"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ui:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    networks:
      - gospel-network

networks:
  gospel-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  caddy_data: {}
  caddy_config: {}
