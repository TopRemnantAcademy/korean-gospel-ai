# fly.toml app configuration file generated for korean-gospel-ai on 2026-06-11T07:18:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'korean-gospel-ai'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  EMBEDDER = 'hf_inference'
  PORT = '8000'
  PYTHONUNBUFFERED = '1'
  QDRANT_SPARSE_ENABLED = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
